# ============================================================
#  大一统服务端 统一配置文件 (Unified Netplay Server)
#  修改后用 scripts/unified-server restart 全部生效
# ============================================================

# ---- 基本路径(一般无需修改,脚本会自动定位) ----
ROOT_DIR=.

# ---- 端口分配(各服务端进程监听端口) ----
PSP_ADHOCCTL_PORT=27312          # PSP 组管理服务(adhocctl)
PSP_POSTOFFICE_PORT=27313        # PSP 数据中继(postoffice relay)
PSP_POSTOFFICE_DEBUG_PORT=27314  # postoffice 调试 API(http://服务器IP:27314/data_debug)
AZAHAR_ROOM_PORT=24872           # 3DS 联机房间服务器(azahar-room)
EDEN_ROOM_PORT=24873             # Switch 联机房间服务器(eden-room)
WEBUI_PORT=8080                  # 大一统状态页 + 管理面板

# ============================================================
#  公告公示模式 (房间如何出现在玩家面前)
# ============================================================
# 第一个房间服务器启动时只能选一个公示目标:
#   模式A 本地公示(默认):web-api-url = WEB_API_URL(服始皇自己的 /lobby 玩家状态页)
#   模式B CVN Play 公示:开启 CVN_PLAY_ENABLED 并填 CVN 账号 token,房间挂到 CVN 中国大厅
#       (CVN 只做列表广播,不中转数据;玩家能连上还取决于你的公网/穿端口)
# 若想同时挂两边(双公示),用 webui 的 LOBBY_RELAY_URL(见 webui 说明)
# ============================================================
CVN_PLAY_ENABLED=false
CVN_PLAY_WEB_API_URL=https://cvnplay.com
CVN_PLAY_USERNAME=
CVN_PLAY_TOKEN=

# 若想同时挂两边(双公示):开启下方 relay,服始皇把收到的房间公告同时转发到外部大厅
#   LOBBY_RELAY_URL=https://cvnplay.com   (示例:CVN Play 中国大厅)
#   LOBBY_RELAY_ENABLED=false
#   LOBBY_RELAY_TOKEN=(如需,留空则匿名转发)
# ============================================================
LOBBY_RELAY_ENABLED=false
LOBBY_RELAY_URL=https://cvnplay.com
LOBBY_RELAY_TOKEN=

# 服始皇自己的公告接口地址(本地公示;状态页/客户端查询房间也走这里)
# 实机部署时改成公网可达地址,例如 http://123.45.67.89:8080 或 https://lobby.你的域名
# ============================================================
#  PSP 联机服务  (aemu / PPSSPP 客户端使用)
#  客户端填写的服务器地址: http://你服务器的IP/ 或 IP:27312/27313
#  使用 aemu 插件或 PPSSPP 网络功能连接
# ============================================================
PSP_SERVER_NAME=服始皇 PSP 联机服务
# postoffice 数据中继严格模式(默认关闭)
POSTOFFICE_STRICT_MODE=false

# ============================================================
#  3DS 联机房间服务器 (azahar-room)
#  这是"服务端"进程:玩家用 Azahar 模拟器 -> 多人游戏 -> 加入房间
#  填服务器IP:AZAHAR_ROOM_PORT 即可
# ============================================================
AZAHAR_ROOM_NAME=服始皇 3DS 联机房间
AZAHAR_ROOM_DESCRIPTION=Hosted by All-in-One Netplay Server
AZAHAR_ROOM_PASSWORD=
AZAHAR_ROOM_MAX_MEMBERS=16
AZAHAR_ROOM_PREFERRED_GAME=Super Mario 3D Land
AZAHAR_ROOM_PREFERRED_GAME_ID=0x0004000000030800
# 公告令牌:公告通过本服务器自己的 webui 中转(/lobby 接口),不依赖任何官方服务器
# 令牌仅作为开启公告的标志,玩家加入房间无需令牌

AZAHAR_ROOM_USERNAME=unified
AZAHAR_ROOM_TOKEN=unified-server
# 注意:官方公告服务器(api.azahar-emu.org 等)已不可用,
# 公告走本服务器自身的 webui(/lobby),玩家状态页与客户端查询房间也走这里。
WEB_API_URL=http://127.0.0.1:8080

# ============================================================
#  Switch 联机房间服务器 (eden-room)
#  玩家用 Eden 模拟器 -> 多人游戏 -> 加入房间,填服务器IP:EDEN_ROOM_PORT
# ============================================================
EDEN_ROOM_NAME=服始皇 Switch 联机房间
EDEN_ROOM_DESCRIPTION=Hosted by All-in-One Netplay Server
EDEN_ROOM_PASSWORD=
EDEN_ROOM_MAX_MEMBERS=16
EDEN_ROOM_PREFERRED_GAME=Mario Kart 8 Deluxe
EDEN_ROOM_PREFERRED_GAME_ID=0x0100152000022000
EDEN_ROOM_USERNAME=unified
EDEN_ROOM_TOKEN=unified-server

# ============================================================
#  管理面板(玩家状态页在 / ,管理面板在 /admin)
# ============================================================
ADMIN_PASSWORD=change-me
# 允许自定义玩家状态页:把文件放到 custom/ 目录
#   custom/index.html  -> 完全替换玩家状态页
#   custom/style.css   -> 覆盖默认样式
#   custom/logo.png    -> 自定义图标