name: build-linux

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  CI: true

jobs:
  build-psp:
    name: PSP 服务端 (adhocctl + postoffice) ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make libsqlite3-dev
      - name: 构建
        run: bash scripts/build-psp.sh
      - name: 打包产物
        run: |
          cd build
          tar -czf ../psp.tar.gz bin/pspnet_adhocctl_server bin/database.db postoffice
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: psp-${{ matrix.arch }}
          path: psp.tar.gz

  build-azahar-room:
    name: 3DS 房间服务器 (azahar-room) ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build git ca-certificates \
            libssl-dev pkg-config
      - name: 构建 azahar-room
        run: bash scripts/build-azahar-room.sh
      - name: 打包产物
        run: |
          cd build
          tar -czf ../azahar-room.tar.gz bin/azahar-room
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: azahar-${{ matrix.arch }}
          path: azahar-room.tar.gz

  build-eden-room:
    name: Switch 房间服务器 (eden-room) ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build git ca-certificates \
            libssl-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
      - name: 构建 eden-room
        run: bash scripts/build-eden-room.sh
      - name: 打包产物
        run: |
          cd build
          tar -czf ../eden-room.tar.gz bin/eden-room
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: eden-${{ matrix.arch }}
          path: eden-room.tar.gz

  package:
    name: 打包 Linux 发布版 ${{ matrix.arch }}
    needs: [ build-psp, build-azahar-room, build-eden-room ]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: 安装打包工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils file
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: psp-${{ matrix.arch }}
          path: build/artifacts/psp
      - uses: actions/download-artifact@v4
        with:
          name: azahar-${{ matrix.arch }}
          path: build/artifacts/azahar
      - uses: actions/download-artifact@v4
        with:
          name: eden-${{ matrix.arch }}
          path: build/artifacts/eden
      - name: 汇总并打包
        run: |
          mkdir -p build/bin build/postoffice
          tar -xzf build/artifacts/psp/psp.tar.gz -C build
          tar -xzf build/artifacts/azahar/azahar-room.tar.gz -C build
          tar -xzf build/artifacts/eden/eden-room.tar.gz -C build
          chmod +x build/bin/* scripts/*.sh
          bash scripts/package.sh ${{ matrix.arch }}
      - name: 上传发布包 (AppImage + tar.gz + sha256)
        uses: actions/upload-artifact@v4
        with:
          name: fushihuang-server-linux-${{ matrix.arch }}
          path: dist/fushihuang-server-linux-*

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部发布包
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fushihuang-server-linux-*