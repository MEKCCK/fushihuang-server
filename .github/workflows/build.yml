name: build-linux

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  CI: true

jobs:
  build-psp:
    name: PSP 服务端 (adhocctl + postoffice)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make libsqlite3-dev
      - name: 构建
        run: bash scripts/build-psp.sh
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: build-psp
          path: |
            build/bin/pspnet_adhocctl_server
            build/bin/database.db
            build/postoffice/

  build-azahar-room:
    name: 3DS 房间服务器 (azahar-room)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build git ca-certificates \
            libssl-dev pkg-config
      - name: 构建 azahar-room
        run: bash scripts/build-azahar-room.sh
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: build-azahar-room
          path: build/bin/azahar-room

  build-eden-room:
    name: Switch 房间服务器 (eden-room)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build git ca-certificates \
            libssl-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
      - name: 构建 eden-room
        run: bash scripts/build-eden-room.sh
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: build-eden-room
          path: build/bin/eden-room

  package:
    name: 打包 Linux 发布版
    needs: [ build-psp, build-azahar-room, build-eden-room ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-psp, path: build/artifact-psp }
      - uses: actions/download-artifact@v4
        with: { name: build-azahar-room, path: build/artifact-azahar }
      - uses: actions/download-artifact@v4
        with: { name: build-eden-room, path: build/artifact-eden }
      - name: 汇总产物
        run: |
          mkdir -p build/bin build/postoffice
          cp -f build/artifact-psp/pspnet_adhocctl_server build/bin/
          cp -f build/artifact-psp/database.db build/bin/
          cp -rf build/artifact-psp/postoffice/. build/postoffice/
          cp -f build/artifact-azahar/azahar-room build/bin/
          cp -f build/artifact-eden/eden-room build/bin/
          chmod +x build/bin/* scripts/*.sh
      - name: 打包
        run: bash scripts/package.sh x86_64
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fushihuang-server-linux-x86_64.tar.gz
            dist/fushihuang-server-linux-x86_64.tar.gz.sha256
      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: fushihuang-server-linux-x64
          path: dist/fushihuang-server-linux-x86_64.tar.gz*